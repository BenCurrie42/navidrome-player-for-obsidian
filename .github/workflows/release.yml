name: Release

# Obsidian's community-plugin updater reads main.js, manifest.json, and styles.css
# off the GitHub Release assets — main.js is gitignored and never in the repo, so
# a release without those three attached is uninstallable. This builds them from
# the tagged commit and attaches them automatically.
on:
  push:
    tags:
      # Bare semver, no "v" prefix — the tag has to equal manifest.json's version.
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Obsidian matches the release tag against manifest.json. A mismatch ships a
      # release nobody can install, so fail here rather than after the upload.
      - name: Check tag matches manifest.json
        run: |
          manifest_version="$(jq -r .version manifest.json)"
          if [ "$GITHUB_REF_NAME" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag may already have a release attached (created by hand before
          # pushing the tag), so upload into it instead of failing on create.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              main.js manifest.json styles.css --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              main.js manifest.json styles.css \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
